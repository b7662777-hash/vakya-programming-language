name: Windows Build & GUI Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  windows-build:
    name: Windows Standalone Build & GUI Smoke Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Windows Build Pipeline
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1

      - name: Verify Build Artifacts
        run: |
          powershell -Command "
            if (-not (Test-Path 'dist\vakya.exe')) { throw 'vakya.exe was not built' }
            if (-not (Test-Path 'dist\Vakya-v0.1.0-Windows-x64.zip')) { throw 'Release ZIP was not created' }
            if (-not (Test-Path 'release-manifest.json')) { throw 'release-manifest.json was not generated' }
            Write-Host 'All release assets verified successfully.' -ForegroundColor Green
          "
