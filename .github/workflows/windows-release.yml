name: Vākya Windows Release & Distribution Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Package Windows Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Run Full Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Execute Windows Release Build Pipeline
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1

      - name: Verify Distribution Artifacts
        run: |
          if (-not (Test-Path "dist\Vakya\bin\vakya.exe")) { throw "vakya.exe is missing" }
          if (-not (Test-Path "dist\Vakya-v0.1.0-Windows-x64.zip")) { throw "Release zip is missing" }
          if (-not (Test-Path "release-manifest.json")) { throw "release-manifest.json is missing" }

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vakya-Windows-x64
          path: |
            dist/Vakya-v0.1.0-Windows-x64.zip
            dist/Vakya/bin/vakya.exe
            release-manifest.json
